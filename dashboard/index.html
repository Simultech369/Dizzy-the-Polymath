<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dizzy - Drift & Memory Dashboard</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.7);
      --border-color: rgba(34, 48, 77, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
      padding: 2rem;
    }

    h1, h2, h3 {
      font-family: 'Outfit', sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 2px solid var(--primary);
    }

    .title-sub {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: 350px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-primary {
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .badge-emerald {
      background: rgba(16, 185, 129, 0.2);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-amber {
      background: rgba(245, 158, 11, 0.2);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .prompt-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .prompt-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.8rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    .prompt-path {
      font-family: monospace;
      font-size: 0.85rem;
    }

    .search-container {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .search-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      padding: 0.75rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .results-table th, .results-table td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .results-table th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.875rem;
    }

    .results-table td {
      font-size: 0.9rem;
    }

    .file-path {
      font-family: monospace;
      color: var(--primary);
    }

    .bar-container {
      width: 80px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
    }

    .metric-value {
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--text-muted);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    .doc-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 1rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .doc-item:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .doc-path {
      font-family: monospace;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.9rem;
    }

    .doc-metrics {
      display: flex;
      gap: 1.5rem;
      margin: 0.5rem 0;
      flex-wrap: wrap;
    }

    .doc-metric {
      display: flex;
      align-items: center;
    }

    .doc-excerpt {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      background: rgba(0,0,0,0.2);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-top: 0.5rem;
      white-space: pre-wrap;
    }

    .tab-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 0.5rem;
    }

    .tab {
      padding: 0.5rem 1rem;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab.active {
      color: var(--primary);
      border-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="/assets/logo" alt="Dizzy Logo" class="logo-img">
      <div>
        <h2>Dizzy Calibration Playground</h2>
        <div class="title-sub">Drift & Epistemic Memory Dashboard</div>
      </div>
    </div>
    <span class="badge badge-emerald">Online</span>
  </header>

  <div class="grid">
    <!-- Sidebar: Prompt Pack Details -->
    <div class="card">
      <div class="card-title">Prompt Pack Config</div>
      <div style="margin-bottom: 1rem; font-size: 0.9rem;">
        <span style="color: var(--text-muted);">Active Pack:</span>
        <strong id="active-pack" style="color: var(--primary);">Loading...</strong>
      </div>
      <ul class="prompt-list" id="prompt-sources-list">
        <!-- Rendered dynamically -->
      </ul>
    </div>

    <!-- Main Content Area -->
    <div class="card">
      <div class="tab-container">
        <div class="tab active" data-tab-target="tab-memory">Memory Database</div>
        <div class="tab" data-tab-target="tab-search">Sieve Retrieval Tester</div>
      </div>

      <!-- Tab 1: Memory Database -->
      <div id="tab-memory" class="tab-content active">
        <div class="card-list" id="memory-docs-list">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Tab 2: Sieve Retrieval Tester -->
      <div id="tab-search" class="tab-content">
        <div class="search-container">
          <input type="text" id="search-query" class="search-input" placeholder="Type query (e.g. apple colors or preventative economics)...">
          <button class="btn" id="search-button">Query Sieve</button>
        </div>
        <div id="search-results-container">
          <table class="results-table">
            <thead>
              <tr>
                <th>Path</th>
                <th>Confidence</th>
                <th>Decay</th>
                <th>Final Score</th>
                <th>Reasons</th>
              </tr>
            </thead>
            <tbody id="search-results-body">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-muted);">Type a query above to run the live retrieval sieve.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/dashboard.js" defer></script>
</body>
</html>
